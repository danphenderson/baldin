# To install the git pre-commit hook run:
#   pre-commit install
# To update the pre-commit hooks run:
#   pre-commit install-hooks

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: debug-statements
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
        types_or: [python, pyi]
      - id: ruff-format
        files: ^backend/
        types_or: [python, pyi]
  - repo: local
    hooks:
      - id: openapi-schema-update
        name: Update OpenAPI and TypeScript schemas
        entry: ./scripts/update_frontend_schemas.sh
        language: script
        files: backend/app/(schemas\.py|api/.*\.py)
        pass_filenames: false
      - id: branch-protection-sync
        name: Check branch protection required checks
        entry: python3 ./scripts/check_branch_protection.py
        language: system
        always_run: true
        pass_filenames: false
