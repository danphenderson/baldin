name: Build Candidate Artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-backend-image:
    name: Build Backend Candidate Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend container image
        run: docker build -f backend/Dockerfile -t baldin-api-candidate:${{ github.sha }} backend

      - name: Capture backend build metadata
        run: |
          mkdir -p build-artifacts/backend
          docker image inspect baldin-api-candidate:${GITHUB_SHA} > build-artifacts/backend/image-inspect.json
          printf '%s\n' "baldin-api-candidate:${GITHUB_SHA}" > build-artifacts/backend/image-name.txt

      - name: Upload backend build metadata
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-metadata
          path: build-artifacts/backend
          if-no-files-found: error

  build-frontend-static:
    name: Build Frontend Candidate Bundle
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://api.preview.invalid

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend static bundle
        working-directory: frontend
        run: npm run build

      - name: Upload frontend static bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-static-bundle
          path: frontend/dist
          if-no-files-found: error
