name: CI
concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{ github.ref_type }}-
    ${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      git-ref:
        description: Git Ref (Optional)
        required: false
  push:
    paths-ignore:
      - ".editorconfig"
      - ".gitattributes"
      - ".gitignore"
      - ".gitmodules"
      - "*.ini"
      - "*.md"
      - "**/*.txt"
      - "docs/**"
    branches:
      - main
  pull_request:
    paths-ignore:
      - ".editorconfig"
      - ".gitattributes"
      - ".gitignore"
      - ".gitmodules"
      - "*.md"
      - "**/*.txt"
      - "docs/**"
permissions:
  contents: read # to fetch code (actions/checkout)


jobs:
  lint:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    env:
      PYTHONWARNINGS: ignore:DEPRECATION
      PYTHONIOENCODING: "utf-8"
      GIT_ASK_YESNO: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: 3.11.2
      - run: |
          python -m pip install pre-commit
          pre-commit run --all-files --verbose --show-diff-on-failure

  backend-tests:
    name: Backend tests and coverage
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PIPENV_VENV_IN_PROJECT: "1"
      PIPENV_DONT_LOAD_ENV: "1"
      PYTHONWARNINGS: ignore:DEPRECATION
      PYTHONIOENCODING: "utf-8"
      GIT_ASK_YESNO: "false"
      SECRET_KEY: ci-secret-key
      ENVIRONMENT: PYTEST
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://test
      MAX_CONCURRENCY: 1
      MAX_CHUNKS: -1
      LOGGING_LEVEL: INFO
      DEFAULT_DATABASE_HOSTNAME: 127.0.0.1
      DEFAULT_DATABASE_USER: postgres
      DEFAULT_DATABASE_PASSWORD: postgres
      DEFAULT_DATABASE_PORT: 5432
      DEFAULT_DATABASE_DB: test_db
      TEST_DATABASE_HOSTNAME: 127.0.0.1
      TEST_DATABASE_USER: postgres
      TEST_DATABASE_PASSWORD: postgres
      TEST_DATABASE_PORT: 5432
      TEST_DATABASE_DB: test_db
      FIRST_SUPERUSER_EMAIL: ci-admin@example.com
      FIRST_SUPERUSER_PASSWORD: CiAdmin1Pass
      OPENAI_API_KEY: test-openai-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: 3.11.2
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install pipenv
          pipenv sync --dev
      - name: Run backend pytest suite with coverage gate
        working-directory: backend
        run: |
          pipenv run pytest \
            --cov=app \
            --cov=etl \
            --cov-report=term-missing \
            --cov-fail-under=60

  frontend-tests:
    name: Frontend tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

  frontend-typecheck:
    name: Frontend typecheck
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend typecheck
        working-directory: frontend
        run: npx tsc --noEmit

  frontend-build:
    name: Frontend build
    needs: lint
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://api.preview.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build

  schema-freshness:
    name: API contract freshness
    needs: lint
    runs-on: ubuntu-latest
    env:
      PIPENV_VENV_IN_PROJECT: "1"
      PIPENV_DONT_LOAD_ENV: "1"
      PYTHONWARNINGS: ignore:DEPRECATION
      PYTHONIOENCODING: "utf-8"
      GIT_ASK_YESNO: "false"
      SECRET_KEY: ci-secret-key
      ENVIRONMENT: PYTEST
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://test
      MAX_CONCURRENCY: 1
      MAX_CHUNKS: -1
      LOGGING_LEVEL: INFO
      DEFAULT_DATABASE_HOSTNAME: 127.0.0.1
      DEFAULT_DATABASE_USER: postgres
      DEFAULT_DATABASE_PASSWORD: postgres
      DEFAULT_DATABASE_PORT: 5432
      DEFAULT_DATABASE_DB: test_db
      TEST_DATABASE_HOSTNAME: 127.0.0.1
      TEST_DATABASE_USER: postgres
      TEST_DATABASE_PASSWORD: postgres
      TEST_DATABASE_PORT: 5432
      TEST_DATABASE_DB: test_db
      FIRST_SUPERUSER_EMAIL: ci-admin@example.com
      FIRST_SUPERUSER_PASSWORD: CiAdmin1Pass
      OPENAI_API_KEY: test-openai-key
      SCHEMA_UPDATE_FORCE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: 3.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install pipenv
          pipenv sync --dev
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Regenerate API contract artifacts
        run: ./scripts/update_frontend_schemas.sh
      - name: Verify generated artifacts are committed
        run: |
          git diff --exit-code -- openapi.json frontend/src/schema.d.ts
