services:
  db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./backend/public/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db"]
      interval: 10s
      timeout: 5s
      retries: 5

  test_db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    ports:
      - "5431:5432"
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./backend/public/test_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
      target: dev
    working_dir: /usr/src/app
    command: uvicorn --app-dir /usr/src/app app.main:app --reload --workers 1 --host 0.0.0.0 --port 8000
    env_file:
      - ./backend/.env
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LINKEDIN_USERNAME: ${LINKEDIN_USERNAME:-}
      LINKEDIN_PASSWORD: ${LINKEDIN_PASSWORD:-}
      GLASSDOOR_USERNAME: ${GLASSDOOR_USERNAME:-}
      GLASSDOOR_PASSWORD: ${GLASSDOOR_PASSWORD:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
      REDIS_URL: redis://redis:6379/0
      CRAWLER_QUEUE_NAME: crawler_jobs
      CRAWLER_EXECUTION_MODE: worker
    volumes:
      - ./backend:/usr/src/app
    ports:
      - 8004:8000
    depends_on:
      db:
        condition: service_healthy
      test_db:
        condition: service_healthy
      redis:
        condition: service_healthy

  crawler-worker:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    command: python -m app.crawler_worker
    env_file:
      - ./backend/.env
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LINKEDIN_USERNAME: ${LINKEDIN_USERNAME:-}
      LINKEDIN_PASSWORD: ${LINKEDIN_PASSWORD:-}
      GLASSDOOR_USERNAME: ${GLASSDOOR_USERNAME:-}
      GLASSDOOR_PASSWORD: ${GLASSDOOR_PASSWORD:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
      REDIS_URL: redis://redis:6379/0
      CRAWLER_QUEUE_NAME: crawler_jobs
      CRAWLER_EXECUTION_MODE: worker
    volumes:
      - ./backend:/usr/src/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    env_file:
      - ./frontend/.env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8004}
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
      VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-DEV}
      VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-0}
    command: npm run dev
    stdin_open: true
    tty: true
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - 5173:5173
    depends_on:
      - web

  docs:
    build:
      context: ./docs
      dockerfile: ./Dockerfile
    command: npm run start -- --host 0.0.0.0 --port 3000 --no-open
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    stdin_open: true
    tty: true
    volumes:
      - ./docs:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - 3001:3000
