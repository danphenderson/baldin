# Alembic configuration for Baldin backend.
#
# The database URL is assembled at runtime by alembic/env.py from the same
# environment variables that core/conf.py uses, so this file intentionally
# leaves sqlalchemy.url blank.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Template used by 'alembic revision'
# file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
file_template = %%(rev)s_%%(slug)s

# Truncate long revision slugs
truncate_slug_length = 60

# timezone for file_template timestamps (if used)
# timezone =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
